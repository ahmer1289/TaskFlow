<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>TaskFlow - Task List</title>
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <header class="site-header">
            <nav class="navbar container">
                <a class="brand" href="index.html">TaskFlow</a>
                <ul class="nav">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="add-task.html">Add Task</a></li>
                    <li><a class="active" href="task-list.html">Task
                            List</a></li>
                    <li><a href="task-detail.html">Task Detail</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="container task-list-page">
                <div class="task-list-header">
                    <h1>Tasks</h1>
                    <div class="task-actions">
                        <a class="btn primary" href="add-task.html">Add Task</a>
                    </div>
                </div>

                <div class="task-controls">
                    <input id="search" type="search"
                        placeholder="Search tasks..." />
                    <select id="filter">
                        <option value="all">All</option>
                        <option value="todo">To do</option>
                        <option value="in-progress">In progress</option>
                        <option value="done">Done</option>
                    </select>
                    <select id="sort">
                        <option value="newest">Newest</option>
                        <option value="oldest">Oldest</option>
                        <option value="priority">Priority</option>
                    </select>
                </div>

                <ul id="tasks" class="task-list">
                    <!-- Sample tasks will be rendered here -->
                </ul>

                <template id="task-template">
                    <li class="task-item">
                        <a class="task-link" href="task-detail.html?id={id}">
                            <div class="task-main">
                                <h3 class="task-title">{title}</h3>
                                <p class="task-note">{notes}</p>
                            </div>
                            <div class="task-meta">
                                <span class="due">Due: {due}</span>
                                <span
                                    class="priority {priorityClass}">{priority}</span>
                            </div>
                        </a>
                    </li>
                </template>
            </section>

            <footer class="site-footer">
                <div class="container">
                    <p>© <span id="year">2026</span> TaskFlow — Built with
                        care.</p>
                </div>
            </footer>

            <script>
            // Update footer year
            document.getElementById('year').textContent = new Date().getFullYear();

            // Sample data (derived from project README and site examples)
            const sampleTasks = [
                { id: 1, title: 'Design homepage layout', notes: 'Create hero and features sections', due: 'Tomorrow', priority: 'High', status: 'in-progress' },
                { id: 2, title: 'Write README.md', notes: 'Document setup and usage', due: 'In 3 days', priority: 'Medium', status: 'todo' },
                { id: 3, title: 'Fix login bug', notes: 'Investigate auth redirect', due: 'Today', priority: 'High', status: 'todo' },
                { id: 4, title: 'Prepare presentation', notes: 'Slides for sprint review', due: 'Next week', priority: 'Low', status: 'done' }
            ];

            const tasksEl = document.getElementById('tasks');
            const template = document.getElementById('task-template').innerHTML;

            function render(list) {
                tasksEl.innerHTML = '';
                list.forEach(t => {
                    const priorityClass = t.priority.toLowerCase();
                    const html = template
                        .replace('{id}', t.id)
                        .replace('{title}', t.title)
                        .replace('{notes}', t.notes)
                        .replace('{due}', t.due)
                        .replace('{priority}', t.priority)
                        .replace('{priorityClass}', priorityClass);
                    tasksEl.insertAdjacentHTML('beforeend', html);
                });
            }

            // Filters
            const search = document.getElementById('search');
            const filter = document.getElementById('filter');
            const sort = document.getElementById('sort');

            function applyControls() {
                let list = sampleTasks.slice();
                const q = search.value.trim().toLowerCase();
                if (q) list = list.filter(t => (t.title + ' ' + t.notes).toLowerCase().includes(q));
                const f = filter.value;
                if (f !== 'all') list = list.filter(t => t.status === f);
                if (sort.value === 'newest') list = list.sort((a,b) => b.id - a.id);
                if (sort.value === 'oldest') list = list.sort((a,b) => a.id - b.id);
                if (sort.value === 'priority') list = list.sort((a,b) => {
                    const order = { 'High': 0, 'Medium': 1, 'Low': 2 };
                    return order[a.priority] - order[b.priority];
                });
                render(list);
            }

            search.addEventListener('input', applyControls);
            filter.addEventListener('change', applyControls);
            sort.addEventListener('change', applyControls);

            // Initial render
            render(sampleTasks);
        </script>
        </main>
    </body>

</html>
